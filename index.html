<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.35), transparent 30%),
      radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.25), transparent 30%),
      linear-gradient(135deg, #080b18, #17113b, #090d20);
    color: white;
  }

  .flui-site {
    min-height: auto;
    padding: 40px 20px;
    box-sizing: border-box;
  }

  .flui-container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    text-align: center;
  }

  /* =========================================
     BANNER PRINCIPAL
     ========================================= */

  .banner-flui {
    width: 100%;
    margin: 0 auto 30px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.40),
      0 0 35px rgba(139, 92, 246, 0.18);
  }

  .banner-flui img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* =========================================
     PLAYER RÁDIO FLUI
     ========================================= */

  #radio-flui-player {
    width: 100%;
    max-width: 900px;
    margin: 20px auto;
    padding: 22px 25px;
    box-sizing: border-box;

    border-radius: 26px;

    background:
      radial-gradient(
        circle at top right,
        rgba(139,92,246,.28),
        transparent 40%
      ),
      linear-gradient(
        145deg,
        #0f172a,
        #172554
      );

    border: 1px solid rgba(103,232,249,.25);

    box-shadow:
      0 20px 50px rgba(0,0,0,.35),
      inset 0 0 30px rgba(56,189,248,.05);

    color: white;

    font-family:
      Arial,
      Helvetica,
      sans-serif;
  }

  /* =========================================
     ÁREA SUPERIOR HORIZONTAL
     ========================================= */

  .flui-main-row {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
  }

  /* LOGO */

  .flui-logo {
    width: 62px;
    height: 62px;
    flex: 0 0 62px;

    border-radius: 50%;
    padding: 5px;

    box-sizing: border-box;

    background:
      linear-gradient(
        135deg,
        #38bdf8,
        #8b5cf6
      );

    box-shadow:
      0 0 25px rgba(139,92,246,.35);
  }

  .flui-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    background: #0f172a;
  }

  /* NOME DA RÁDIO */

  .flui-brand {
    flex: 0 0 145px;
    text-align: left;
  }

  .flui-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
  }

  .flui-live {
    margin-top: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #67e8f9;

    display: flex;
    align-items: center;
    gap: 6px;
  }

  .flui-live-dot {
    width: 7px;
    height: 7px;

    background: #67e8f9;
    border-radius: 50%;

    box-shadow:
      0 0 10px #67e8f9;

    animation: flui-pulse 1.5s infinite;
  }

  /* =========================================
     AGORA TOCANDO
     ========================================= */

  .flui-now {
    flex: 1;
    min-width: 0;

    padding: 13px 18px;

    border-radius: 17px;

    background:
      rgba(15,23,42,.65);

    border:
      1px solid rgba(103,232,249,.12);

    text-align: left;
  }

  .flui-now-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #67e8f9;
    margin-bottom: 5px;
  }

  .flui-artist {
    font-size: 17px;
    font-weight: 700;
    color: white;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .flui-title {
    margin-top: 3px;
    font-size: 13px;
    color: #c4b5fd;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* =========================================
     ONDAS
     ========================================= */

  .flui-waves {
    width: 100%;
    height: 45px;

    margin: 12px 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 4px;
  }

  .flui-waves span {
    width: 4px;
    height: 15px;

    border-radius: 5px;

    background:
      linear-gradient(
        to top,
        #38bdf8,
        #8b5cf6
      );

    animation:
      flui-wave 1s ease-in-out infinite;

    animation-play-state: paused;
  }

  .flui-waves span:nth-child(2) { animation-delay: .1s; }
  .flui-waves span:nth-child(3) { animation-delay: .2s; }
  .flui-waves span:nth-child(4) { animation-delay: .3s; }
  .flui-waves span:nth-child(5) { animation-delay: .4s; }
  .flui-waves span:nth-child(6) { animation-delay: .5s; }
  .flui-waves span:nth-child(7) { animation-delay: .6s; }
  .flui-waves span:nth-child(8) { animation-delay: .5s; }
  .flui-waves span:nth-child(9) { animation-delay: .4s; }
  .flui-waves span:nth-child(10) { animation-delay: .3s; }
  .flui-waves span:nth-child(11) { animation-delay: .2s; }
  .flui-waves span:nth-child(12) { animation-delay: .1s; }

  .flui-playing span {
    animation-play-state: running;
  }

  /* =========================================
     CONTROLES
     ========================================= */

  .flui-controls {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .flui-button {
    width: 52px;
    height: 52px;

    flex: 0 0 52px;

    border: none;
    border-radius: 50%;

    cursor: pointer;

    font-size: 19px;
    color: white;

    background:
      linear-gradient(
        135deg,
        #38bdf8,
        #8b5cf6
      );

    box-shadow:
      0 8px 20px rgba(56,189,248,.25);

    transition:
      transform .2s ease,
      box-shadow .2s ease;
  }

  .flui-button:hover {
    transform: scale(1.06);

    box-shadow:
      0 10px 28px rgba(139,92,246,.4);
  }

  .flui-volume {
    flex: 1;

    display: flex;
    align-items: center;

    gap: 10px;
  }

  .flui-volume-icon {
    font-size: 16px;
  }

  #flui-volume {
    width: 100%;
    accent-color: #8b5cf6;
  }

  /* =========================================
     SLOGAN
     ========================================= */

  .flui-slogan {
    margin-top: 15px;

    text-align: center;

    font-size: 11px;
    letter-spacing: 1px;

    color: #94a3b8;
  }

  /* =========================================
     ANIMAÇÕES
     ========================================= */

  @keyframes flui-wave {

    0%,100% {
      height: 12px;
    }

    50% {
      height: 42px;
    }

  }

  @keyframes flui-pulse {

    0%,100% {
      opacity: .4;
      transform: scale(.8);
    }

    50% {
      opacity: 1;
      transform: scale(1.2);
    }

  }

  /* ESCONDE O METADATA ORIGINAL */

  #flui-metadata {
    display: none !important;
  }

  /* =========================================
     CELULAR
     ========================================= */

  @media (max-width: 700px) {

    .flui-site {
      padding: 25px 12px;
    }

    #radio-flui-player {
      padding: 20px 17px;
      border-radius: 22px;
    }

    .flui-main-row {
      flex-wrap: wrap;
      gap: 12px;
    }

    .flui-logo {
      width: 55px;
      height: 55px;
      flex-basis: 55px;

    .flui-brand {
      flex: 1;

    .flui-name {
      font-size: 19px;
    }

    .flui-now {
      width: 100%;
      flex-basis: 100%;
      box-sizing: border-box;
    }

    .flui-waves {
      height: 38px;
    }

    .flui-slogan {
      font-size: 10px;
    }

  }

</style>

<!-- JAVASCRIPT DO PLAYER -->
<!-- ========================================= -->

<script>

(function() {

  const audio =
    document.getElementById("flui-audio");

  const playButton =
    document.getElementById("flui-play");

  const volume =
    document.getElementById("flui-volume");

  const waves =
    document.getElementById("flui-waves");

  const artist =
    document.getElementById("flui-artist");

  const title =
    document.getElementById("flui-title");

  const metadata =
    document.getElementById("flui-metadata");


  /* VOLUME INICIAL */

  audio.volume = 0.8;


  /* PLAY / PAUSE */

  playButton.addEventListener(
    "click",
    function() {

      if (audio.paused) {

        audio.play()
          .then(function() {

            playButton.innerHTML = "❚❚";

            waves.classList.add(
              "flui-playing"
            );

          })
          .catch(function(error) {

            console.log(
              "Erro ao reproduzir:",
              error
            );

          });

      } else {

        audio.pause();

        playButton.innerHTML = "▶";

        waves.classList.remove(
          "flui-playing"
        );

      }

    }
  );


  /* VOLUME */

  volume.addEventListener(
    "input",
    function() {

      audio.volume =
        parseFloat(this.value);

    }
  );


  /* STATUS DO PLAYER */

  audio.addEventListener(
    "play",
    function() {

      playButton.innerHTML = "❚❚";

      waves.classList.add(
        "flui-playing"
      );

    }
  );


  audio.addEventListener(
    "pause",
    function() {

      playButton.innerHTML = "▶";

      waves.classList.remove(
        "flui-playing"
      );

    }
  );


  /* REMOVE O CÓDIGO DE RASTREAMENTO */

  function limparCodigo(texto) {

    return texto
      .replace(/\s*\[[^\]]+\]\s*$/, "")
      .trim();

  }


  /* ATUALIZA O TEXTO DO PLAYER */

  function atualizarMusica() {

    if (!metadata) return;

    let musica =
      metadata.textContent.trim();


    if (
      !musica ||
      musica === "Carregando ..." ||
      musica === "Carregando..."
    ) {

      return;

    }


    musica =
      limparCodigo(musica);


    /*
     * Se o servidor mandar:
     *
     * Artista - Música
     *
     * separa automaticamente.
     */

    const separador =
      musica.indexOf(" - ");


    if (separador !== -1) {

      const nomeArtista =
        musica.substring(
          0,
          separador
        ).trim();


      const nomeMusica =
        musica.substring(
          separador + 3
        ).trim();


      artist.textContent =
        nomeArtista || "Rádio Flui";


      title.textContent =
        nomeMusica || musica;

    } else {

      artist.textContent =
        "Rádio Flui";

      title.textContent =
        musica;

    }

  }


  /* OBSERVA O WIDGET OFICIAL */

  const observer =
    new MutationObserver(
      function() {

        atualizarMusica();

      }
    );


  observer.observe(
    metadata,
    {
      childList: true,
      characterData: true,
      subtree: true
    }
  );


  /* VERIFICAÇÃO DE SEGURANÇA */

  setInterval(
    atualizarMusica,
    3000
  );


  /* PRIMEIRA LEITURA */

  setTimeout(
    atualizarMusica,
    2000
  );


})();

</script>
