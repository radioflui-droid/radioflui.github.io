<script>

(function() {

  const audio =
    document.getElementById("flui-audio");

  const playButton =
    document.getElementById("flui-play");

  const volume =
    document.getElementById("flui-volume");

  const waves =
    document.getElementById("flui-waves");

  const artist =
    document.getElementById("flui-artist");

  const title =
    document.getElementById("flui-title");

  const metadata =
    document.getElementById("flui-metadata");


  /* VOLUME INICIAL */

  audio.volume = 0.8;


  /* PLAY / PAUSE */

  playButton.addEventListener("click", function() {

    if (audio.paused) {

      audio.play()
        .then(function() {

          playButton.innerHTML = "❚❚";

          waves.classList.add("flui-playing");

        })
        .catch(function(error) {

          console.log(
            "Erro ao reproduzir:",
            error
          );

        });

    } else {

      audio.pause();

      playButton.innerHTML = "▶";

      waves.classList.remove(
        "flui-playing"
      );

    }

  });


  /* VOLUME */

  volume.addEventListener(
    "input",
    function() {

      audio.volume =
        parseFloat(this.value);

    }
  );


  /* STATUS DO PLAYER */

  audio.addEventListener(
    "play",
    function() {

      playButton.innerHTML = "❚❚";

      waves.classList.add(
        "flui-playing"
      );

    }
  );


  audio.addEventListener(
    "pause",
    function() {

      playButton.innerHTML = "▶";

      waves.classList.remove(
        "flui-playing"
      );

    }
  );


  /*
   * REMOVE O CÓDIGO DE RASTREAMENTO
   * DO FINAL DO NOME DA MÚSICA
   *
   * Exemplo:
   * Giz [2x8c]
   *
   * vira:
   * Giz
   */

  function limparCodigo(texto) {

    return texto
      .replace(/\s*\[[^\]]+\]\s*$/, "")
      .trim();

  }


  /*
   * ATUALIZA O TEXTO DO PLAYER
   */

  function atualizarMusica() {

    if (!metadata) return;

    let musica =
      metadata.textContent.trim();


    if (
      !musica ||
      musica === "Carregando ..." ||
      musica === "Carregando..."
    ) {

      return;

    }


    musica =
      limparCodigo(musica);


    /*
     * Se o servidor mandar:
     *
     * Artista - Música
     *
     * separa automaticamente.
     */

    const separador =
      musica.indexOf(" - ");


    if (separador !== -1) {

      const nomeArtista =
        musica.substring(
          0,
          separador
        ).trim();

      const nomeMusica =
        musica.substring(
          separador + 3
        ).trim();


      artist.textContent =
        nomeArtista || "Rádio Flui";

      title.textContent =
        nomeMusica || musica;

    } else {

      artist.textContent =
        "Rádio Flui";

      title.textContent =
        musica;

    }

  }


  /*
   * OBSERVA O WIDGET OFICIAL
   *
   * O streaminfo.js altera o conteúdo
   * do span automaticamente.
   */

  const observer =
    new MutationObserver(function() {

      atualizarMusica();

    });


  observer.observe(
    metadata,
    {
      childList: true,
      characterData: true,
      subtree: true
    }
  );


  /*
   * VERIFICAÇÃO DE SEGURANÇA
   */

  setInterval(
    atualizarMusica,
    3000
  );


  /*
   * PRIMEIRA LEITURA
   */

  setTimeout(
    atualizarMusica,
    2000
  );


})();

</script>
